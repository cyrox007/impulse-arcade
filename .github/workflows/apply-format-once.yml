name: Временное применение единого стиля

on:
  push:
    branches:
      - refactor/readable-code-20261102

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Подготовить воспроизводимые зависимости
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Применить читаемое форматирование
        run: npm run format

      - name: Зафиксировать только изменения исходников
        shell: bash
        run: |
          git add game*.js tests style.css index.html package.json package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: привести игровой код к единому читаемому формату"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
