name: Inspect Pages deployment conflict (temporary)

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  actions: write
  pages: write
  issues: write

jobs:
  diagnose:
    if: github.head_ref == 'ops/recover-pages-2026-11-01'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect actual Pages workflow runs and post diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100"
          response=$(curl -sS --max-time 30 -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" -w '\n%{http_code}' "$api")
          code=$(tail -n1 <<< "$response")
          data=$(sed '$d' <<< "$response")
          echo "Actions runs HTTP=$code payload_bytes=${#data}"
          if [ "$code" != 200 ]; then
            message=$(jq -r '.message // "unknown API error"' <<< "$data" 2>/dev/null || true)
            gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "Pages diagnostics: Actions list API returned HTTP $code, message: $message" || true
            exit 1
          fi
          runs=$(jq -r '.workflow_runs[] | select((.name // "" | ascii_downcase | contains("pages")) or (.path // "" | ascii_downcase | contains("pages"))) | [.id,.name,.status,(.conclusion // "-"),.head_sha,.created_at] | @tsv' <<< "$data" | head -n 15)
          if [ -z "$runs" ]; then runs="No Pages runs in the latest 100 workflows"; fi
          echo "Pages runs:"
          printf '%s\n' "$runs"
          report=$(printf '### GitHub Pages: диагностика реальных запусков\n\nПолучено HTTP %s. Найденные Pages runs (ID, имя, статус, итог, SHA, время):\n\n```\n%s\n```\n\nОтмена старого Pages deployment по SHA ранее дала HTTP 404. Эта задача **только проверяет** список запусков и не меняет игровой код.\n' "$code" "$runs")
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body "$report"
