<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080c1b">
  <meta name="app-build" content="gameplay-081-20261101">
  <meta name="description" content="Импульс — оригинальный арканоид с пятью секторами, свободно движущимися, односторонними, взрывными и призматическими кирпичами, мультишаром и магнитной платформой, механическим Стражем ядра и финальным Реактором, защитным барьером, бонусами и заряжаемым пробивным импульсом. Работает в браузере на телефоне и ПК.">
  <title>ИМПУЛЬС — арканоид</title>
  <link rel="stylesheet" href="style.css?v=gameplay-081-20261101">
  
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><div><span class="eyebrow">АРКАДА • ИГРА 0.8.1</span><h1>ИМПУЛЬС<span class="brand-dot">.</span></h1></div></div>
      <div class="top-actions"><button type="button" id="soundBtn" class="icon-btn" aria-label="Включить звук" title="Включить/выключить звук">♫ <span class="sound-state">ВЫКЛ</span></button><button type="button" id="pauseBtn" class="icon-btn" aria-label="Пауза" title="Пауза (P)">Ⅱ</button></div>
    </header>
    <section class="hud" aria-label="Счёт и прогресс">
      <div class="hud-cell"><span class="hud-label">СЧЁТ <span class="hud-sector" id="compactSector" aria-label="Сектор">01/05</span></span><strong id="score" class="hud-value">000000</strong></div>
      <div class="hud-cell"><span class="hud-label">РЕКОРД</span><strong id="best" class="hud-value">000000</strong></div>
      <div class="hud-cell"><span class="hud-label">ЖИЗНИ</span><strong id="lives" class="hud-value lives">♥ ♥ ♥</strong></div>
    </section>
    <section class="game-frame" aria-label="Игровое поле">
      <div class="game-stage">
        <canvas id="game" width="480" height="720" aria-label="Арканоид. Двигайте платформу пальцем или стрелками. Пробел запускает шар, F включает импульс."></canvas>
        <div id="overlay" class="overlay" role="status" aria-live="polite"></div>
        <div class="stage-corner stage-corner--tl" aria-hidden="true"></div><div class="stage-corner stage-corner--tr" aria-hidden="true"></div><div class="stage-corner stage-corner--bl" aria-hidden="true"></div><div class="stage-corner stage-corner--br" aria-hidden="true"></div>
        <div class="stage-status" aria-hidden="true"><span class="led"></span><span id="stageLabel">СЕКТОР 01 / 03</span></div>
      </div>
    </section>
    <section class="charge" aria-label="Заряд импульса">
      <div class="charge-heading"><span>ЗАРЯД ИМПУЛЬСА</span><span id="chargeText">0%</span></div>
      <div class="charge-track" role="progressbar" aria-label="Заряд импульса" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="chargeBar"><div id="chargeFill" class="charge-fill"></div></div>
      <p id="hint" class="hint">Разбивай блоки, чтобы зарядить пробивной импульс.</p>
    </section>
    <nav class="controls" aria-label="Управление">
      <button type="button" class="control-btn" id="launchBtn"><span class="control-icon">▶</span><span id="launchLabel">СТАРТ</span></button>
      <button type="button" class="control-btn control-btn--pulse" id="pulseBtn" disabled><span class="control-icon">✷</span><span id="pulseLabel">ИМПУЛЬС 0%</span></button>
    </nav>
    <footer class="footer"><span>ПК: ← → / A D · ПРОБЕЛ · F · P</span><span>ТЕЛЕФОН: ВЕДИ ПАЛЬЦЕМ ПО ПОЛЮ</span></footer>
  </main>
<script src="game.js?v=gameplay-081-20261101" defer></script>
</body>
</html>
